  <body>

    <div id="root"></div>

    <script>
      (() => {
        // 用户自定义形状（绿描边 + 白内里）
        const SHAPE = [
          "11..............................",
          "111.............................",
          "1111............................",
          "11111...........................",
          "111111..........................",
          "1111111.........................",
          "11111111........................",
          "111111111.......................",
          "1111111111......................",
          "11111111111.....................",
          "111111111111....................",
          "1111111111111...................",
          "11111111111111..................",
          "111111111111111.................",
          "1111111111111111................",
          "11111111111111111...............",
          "111111111111111111..............",
          "1111111111111111111.............",
          "11111111111111111111............",
          "11111111111111111111............",
          "111111111111....................",
          "111111111111....................",
          "111111111111....................",
          "111111.111111...................",
          "11111..111111...................",
          "1111....111111..................",
          "111.....111111..................",
          "11.......111111.................",
          ".........111111.................",
          "..........111111................",
          "..........111111................",
          "...........1111.................",
        ];
        const GREEN = '#1a5c38';
        const WHITE = '#ffffff';
        const SCALE = 2; // 每个像素块的逻辑尺寸(px)，调大/调小改这里

        const H = SHAPE.length, W = SHAPE[0].length;
        const solid = new Set();
        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (SHAPE[y][x] === '1') solid.add(x + ',' + y);
        const cell = [];
        for (let y = 0; y < H; y++) {
          cell[y] = [];
          for (let x = 0; x < W; x++) {
            if (!solid.has(x + ',' + y)) continue;
            const edge = !solid.has((x + 1) + ',' + y) || !solid.has((x - 1) + ',' + y)
                     || !solid.has(x + ',' + (y + 1)) || !solid.has(x + ',' + (y - 1));
            cell[y][x] = edge ? GREEN : WHITE;
          }
        }

        const canvas = document.createElement('canvas');
        canvas.style.position = 'fixed';
        canvas.style.top = '0'; canvas.style.left = '0';
        canvas.style.pointerEvents = 'none';
        canvas.style.zIndex = '2147483647';
        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');

        function resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.floor(innerWidth * dpr);
          canvas.height = Math.floor(innerHeight * dpr);
          canvas.style.width = innerWidth + 'px';
          canvas.style.height = innerHeight + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        addEventListener('resize', resize);

        let mx = -100, my = -100, raf = 0;
        function draw() {
          raf = 0;
          ctx.clearRect(0, 0, innerWidth, innerHeight);
          for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
            const c = cell[y][x];
            if (!c) continue;
            ctx.fillStyle = c;
            ctx.fillRect(mx + x * SCALE, my + y * SCALE, SCALE, SCALE);
          }
        }
        addEventListener('mousemove', (e) => {
          mx = e.clientX; my = e.clientY;
          if (!raf) raf = requestAnimationFrame(draw);
        }, { passive: true });
        document.addEventListener('mouseleave', () => {
          mx = -100; my = -100;
          if (!raf) raf = requestAnimationFrame(draw);
        });
      })();
    </script>
  </body>
