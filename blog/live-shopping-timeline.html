<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直播购物：从大屏到小屏 — 中美 40 年演变时间线</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --panel:#ffffff;
    --ink:#111111;
    --muted:#8a8a8a;
    --faint:#c9c9c9;
    --line:#eaeaea;
    --spine:#d9d9d9;
    --us:#111111;
    --cn:#b03a2e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Lato",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Helvetica,Arial,sans-serif;
    font-weight:300;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;height:100vh;width:100%}

  /* ===== 左侧：单条时间轴（默认铺满） ===== */
  .timeline-panel{
    flex:1 1 auto;min-width:0;display:flex;flex-direction:column;
    background:var(--panel);border-right:1px solid var(--line);
  }
  .panel-header{
    flex:0 0 auto;padding:34px 52px 18px;
  }
  .panel-header h1{font-size:30px;font-weight:300;letter-spacing:.4px;line-height:1.1}
  .panel-header .sub{font-size:13px;font-weight:300;color:var(--muted);margin-top:8px;letter-spacing:.3px}
  .legend{
    display:flex;align-items:center;gap:22px;margin-top:20px;padding-top:16px;
    border-top:1px solid var(--line);font-size:12px;color:var(--muted);letter-spacing:.5px;
  }
  .legend span{display:flex;align-items:center;gap:7px}
  .legend i{width:8px;height:8px;display:inline-block}
  .legend i.us{background:var(--us)} .legend i.cn{background:var(--cn)}
  .legend .note{color:var(--muted)}

  .timeline-scroll{
    flex:1 1 auto;overflow-y:auto;padding:8px 52px 90px;
    scrollbar-width:thin;scrollbar-color:#d8d8d8 transparent;
  }
  .timeline-scroll::-webkit-scrollbar{width:9px}
  .timeline-scroll::-webkit-scrollbar-thumb{background:#d8d8d8}

  #timeline{position:relative}
  .spine{
    position:absolute;left:50%;width:1px;transform:translateX(-50%);
    background:var(--spine);
  }
  .tick{position:absolute;left:50%;transform:translate(-50%,-50%);border-radius:50%}
  .node{position:absolute;left:0;width:100%;transform:translateY(-50%)}
  .node .card{
    position:absolute;top:0;transform:translateY(-50%);
    width:calc(50% - 44px);max-width:420px;background:var(--bg);
    padding:6px 0 14px;
    cursor:pointer;
  }
  .node.us .card{right:calc(50% + 36px);text-align:right}
  .node.cn .card{left:calc(50% + 36px);text-align:left}
  .card .yr{font-size:24px;font-weight:300;line-height:1;color:var(--ink);letter-spacing:.3px}
  .card .yr.long{font-size:16px}
  .card .desc{font-size:12.5px;font-weight:300;color:var(--muted);line-height:1.65;margin-top:10px}
  .card .play{
    margin-top:10px;font-size:11px;color:var(--muted);letter-spacing:.5px;
    display:none;align-items:center;gap:5px;
  }
  .node.cn .card .play{justify-content:flex-start}
  .node.us .card .play{justify-content:flex-end}
  .node.has-video .play{display:inline-flex}
  .node .card:hover .yr{color:var(--us)}
  .node.cn .card:hover .yr{color:var(--cn)}
  .node.active .card .yr{color:var(--us)}
  .node.cn.active .card .yr{color:var(--cn)}

  /* ===== 右侧：视频播放器（默认收起） ===== */
  .player-panel{
    flex:0 0 auto;width:0;display:flex;flex-direction:column;background:var(--bg);
    overflow:hidden;transition:width .6s cubic-bezier(.4,0,.2,1);
  }
  .app.with-video .player-panel{width:44%}
  .player-sticky{display:flex;flex-direction:column;height:100vh;padding:34px;gap:20px}
  .player-frame{
    flex:0 0 auto;background:#0e0e0e;overflow:hidden;aspect-ratio:16/9;
    opacity:0;transform:translateX(24px);
    transition:opacity .5s ease .05s,transform .6s cubic-bezier(.4,0,.2,1);
  }
  .app.with-video .player-frame{opacity:1;transform:translateX(0)}
  .player-frame video{width:100%;height:100%;display:block;object-fit:contain;background:#0e0e0e}
  .player-frame.hidden{display:none}
  .video-caption{
    flex:0 0 auto;font-size:13px;font-weight:300;color:var(--ink);line-height:1.7;
    border-top:1px solid var(--line);padding-top:16px;
    opacity:0;transform:translateX(16px);
    transition:opacity .5s ease .15s,transform .6s cubic-bezier(.4,0,.2,1);
  }
  .app.with-video .video-caption{opacity:1;transform:translateX(0)}
  .video-caption b{font-weight:400;color:var(--cn)}
  .video-caption:empty{display:none}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="timeline-panel">
    <header class="panel-header">
      <a href="../index.html" style="display:inline-block;margin-bottom:14px;font-size:12px;color:#8a8a8a;text-decoration:none;letter-spacing:.5px">← 返回首页</a>
      <h1>直播购物：从大屏到小屏</h1>
      <div class="sub">中美 40 年演变时间线 · 点击左侧节点播放直播案例</div>
      <div class="legend">
        <span><i class="us"></i>美国</span>
        <span><i class="cn"></i>中国</span>
        <span class="note">▶ 含视频案例</span>
      </div>
    </header>
    <div class="timeline-scroll">
      <div id="timeline"></div>
    </div>
  </aside>

  <section class="player-panel">
    <div class="player-sticky">
      <div class="player-frame hidden" id="player-frame">
        <video id="video" controls playsinline></video>
      </div>
      <div class="video-caption" id="video-caption"></div>
    </div>
  </section>
</div>

<script>
const US = [
  {label:`1978年`, pos:1978, desc:`佛罗里达州的某区域的一家广播电台同意接收一位广告商的100多个电动开罐器作为赞助品。但这位广告商没有足够的资金支付广告时段的费用，于是电台老板Paxson决定让广播员在广播中拍卖这100个开罐器来赚广告费，结果很快就售罄了。很快，一档做商品促销的广播节目应运而生，名为Suncoast Bargaineers。`},
  {label:`1982年`, pos:1982, desc:`电台老板Paxson把这个理念推广到了当地的有线电视网络，成立了一个专门的家居购物频道 Home Shopping Channel，简称HSN，这个区域频道很快扩展成全国频道。`, video:`https://pub-a9426b1d39564788a12ad5ff72fecd38.r2.dev/HSN1999.mp4`, cap:`HSN 1999 年电视购物节目片段。`},
  {label:`1986年`, pos:1986, desc:`在美国第四大有线运营商的支持下，对标HSN的电视频道QVC（Quality Value Convenience）诞生了。`, video:`https://pub-a9426b1d39564788a12ad5ff72fecd38.r2.dev/qvc2001clip.mp4`, cap:`QVC 2001 年节目片段——「质量 · 价值 · 便利」的 24 小时购物台。`},
  {label:`1990s-2000s`, pos:1995, desc:`QVC的业务扩展到了英国和墨西哥，甚至在美国线下购物中心开设了门店，踏入了实体零售的领域。到1995年，QVC的收入已经达到了13.91亿美元（达美乐1995年营收9.1亿，ShakeShack2025年营收14.5亿，买香飘飘可以绕地球8圈），CAGR超过120%。`},
  {label:`2010年`, pos:2010, desc:`QVC的独立站收入占比 2010 年 35.6% → 2011 年 39.7% → 2015 年 47% —— 电视渠道（打电话/遥控器下单）的收入占比逐年走低。全国性晨间新闻节目NBC Today插入导购栏目。`, video:`https://pub-a9426b1d39564788a12ad5ff72fecd38.r2.dev/nbctoday2010.mp4`, cap:`NBC Today 2010 年「Jill's Steals and Deals」导购栏目片段。`},
  {label:`2011年`, pos:2011, desc:`全国性晨间新闻节目GMA也插入导购栏目。`},
  {label:`2017年`, pos:2017, desc:`QVC收购了HSN。`},
  {label:`2019年`, pos:2019, desc:`Amazon 上线 Amazon Live。同年，中国服务商 Firework（2017年成立）开始帮 DTC 品牌在自有网站做可购物直播。`},
  {label:`2020年`, pos:2020, desc:`Meta上线Facebook Live Shopping和Instagram Live Shopping（导流至shopify）。`},
  {label:`2022年`, pos:2022, desc:`eBay 上线 eBay Live，以邀请制运营；Meta 关闭 Facebook Live Shopping。晨间新闻节目CBS Mornings加入Deals导购环节。`},
  {label:`2023年`, pos:2023, desc:`TikTokShop在美国正式上线；Meta 关闭 Instagram Live Shopping。eBayLive累计达成1000+场直播，收藏品全年GMV超过100亿美金。`, video:`https://pub-a9426b1d39564788a12ad5ff72fecd38.r2.dev/ebaylivelvwalletauctionfrom1_30m.mp4`, cap:`eBay Live 奢侈品（LV 钱包）竞拍直播案例。`},
  {label:`2024年`, pos:2024, desc:`TikTokShop美区GMV爆发至90亿美金。Whatnot GMV约30亿美金。`, video:`https://pub-a9426b1d39564788a12ad5ff72fecd38.r2.dev/whatnot.mp4`, cap:`Whatnot 直播带货片段——社交化、秒杀式、收藏品垂类直播。`},
  {label:`2025年`, pos:2025, desc:`TikTokShop美区全年GMV 151亿(+64%)，已超过QVC集团全年营收(92亿、-9%)。QVC 4月在TikTok开24/7直播、11月一度成单月最高营收店铺(月$2500万+)。同年Whatnot GMV超80亿美金。eBay Live扩至欧洲澳洲市场，GMV同比 +8x（Q2）/+5x（Q3）。`},
  {label:`2026年`, pos:2026, desc:`TikTok 3月开通直播竞拍功能对标Whatnot，6月26日年中大促期间设置「拍卖日」，上半年美区GMV 118亿(+103%)；6月QVC做到TikTok Shop全美营收第二、被TikTok Summit封"年度卖家"。Whatnot上半年GMV已超80亿美金；eBayLiveQ2 GMV同比+8x，Q3正式取消邀请制。`},
];
const CN = [
  {label:`1992年`, pos:1992, desc:`广东珠江电视台推出了中国第一档电视购物节目"美的精品TV特惠店"。`},
  {label:`1996年`, pos:1996, desc:`北京电视台开始推出专业的购物节目。`},
  {label:`1998年`, pos:1998, desc:`全国各省市运营着500多个大大小小的电视购物节目，市场规模达到了26亿元人民币。彼时中国电视购物的监管不严格，黑五类产品是电视购物的主力军，由于假冒伪劣问题闹出了不少严重的纠纷。`},
  {label:`2006年`, pos:2006, desc:`国家对电视购物行业进行了整顿，随后央视正式开播"CCTV中视购物"频道，国家主流电视媒体进军电视购物领域。众多耳熟能详的电视直销品牌就是在那几年巅峰时期被推向大众的，比如好记星、背背佳、金立手机等。`},
  {label:`2015年之后`, pos:2015, desc:`中国电视购物的好日子一去不复返，各种因素都的都在宣告电视购物时代的结束 —— 消费者老龄化，用户不断减少；2010年左右移动电商+物流+移动支付同时爆发，年轻一代的线上购物场景注定脱离电视；虚假宣传、夸大描述甚至欺骗的做法已经将消费者的信任殆尽……`},
  {label:`2016年`, pos:2016, desc:`中国网络直播元年，5月份淘宝直播正式上线。同年全国34 家电视购物企业实现销售额 366 亿元，同比下降 8%。`},
  {label:`2018年`, pos:2018, desc:`李佳琦、薇娅等直播电商头部账号崛起，大众消费正式进入直播间。直播电商交易额达1400亿人民币。`},
  {label:`2023年`, pos:2023, desc:`直播电商交易额达4.92万亿人民币。`},
  {label:`2024年`, pos:2024, desc:`直播电商交易额达5.35万亿人民币。`},
  {label:`2025年`, pos:2025, desc:`直播电商交易额破6万亿人民币。`},
  {label:`2026年`, pos:2026, desc:`直播电商交易额预计将达到8万亿人民币。`},
];

const SLOT = 220, PAD_TOP = 30, PAD_BOTTOM = 40;
const years = [...new Set([...US.map(e=>e.pos), ...CN.map(e=>e.pos)])].sort((a,b)=>a-b);
const yearIdx = Object.fromEntries(years.map((y,i)=>[y,i]));
const timeline = document.getElementById('timeline');
timeline.style.height = (years.length * SLOT + PAD_TOP + PAD_BOTTOM) + 'px';

const spine = document.createElement('div');
spine.className = 'spine';
spine.style.top = (PAD_TOP + SLOT/2) + 'px';
spine.style.height = (years.length * SLOT - SLOT) + 'px';
timeline.appendChild(spine);

function yOf(pos){ return PAD_TOP + yearIdx[pos] * SLOT + SLOT/2; }

years.forEach(y => {
  const hasUS = US.some(e=>e.pos===y);
  const hasCN = CN.some(e=>e.pos===y);
  if(hasUS){
    const t = document.createElement('div');
    t.className='tick'; t.style.width='5px'; t.style.height='5px';
    t.style.background='var(--us)'; t.style.top=yOf(y)+'px'; t.style.marginLeft='-7px';
    timeline.appendChild(t);
  }
  if(hasCN){
    const t = document.createElement('div');
    t.className='tick'; t.style.width='5px'; t.style.height='5px';
    t.style.background='var(--cn)'; t.style.top=yOf(y)+'px'; t.style.marginLeft='2px';
    timeline.appendChild(t);
  }
});

function makeNode(ev, country){
  const n = document.createElement('div');
  n.className = 'node ' + country + (ev.video ? ' has-video' : '');
  n.style.top = yOf(ev.pos) + 'px';

  const card = document.createElement('div');
  card.className = 'card';

  const yr = document.createElement('div');
  yr.className = 'yr' + (ev.label.length > 6 ? ' long' : '');
  yr.textContent = ev.label;

  const desc = document.createElement('div');
  desc.className = 'desc';
  desc.textContent = ev.desc;

  card.appendChild(yr);
  card.appendChild(desc);

  if(ev.video){
    const play = document.createElement('div');
    play.className = 'play';
    play.textContent = '▶ 播放案例';
    card.appendChild(play);
  }

  n.appendChild(card);
  n.addEventListener('click', () => select(ev, n));
  return n;
}

US.forEach(e => timeline.appendChild(makeNode(e, 'us')));
CN.forEach(e => timeline.appendChild(makeNode(e, 'cn')));

const app = document.querySelector('.app');
const video = document.getElementById('video');
const frame = document.getElementById('player-frame');
const caption = document.getElementById('video-caption');

function select(ev, node){
  document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
  if(node) node.classList.add('active');

  if(ev.video){
    app.classList.add('with-video');
    frame.classList.remove('hidden');
    video.src = ev.video;
    caption.innerHTML = '<b>视频</b>　' + ev.cap;
    video.play().catch(()=>{});
  }else{
    app.classList.remove('with-video');
    frame.classList.add('hidden');
    video.pause();
    video.removeAttribute('src');
    video.load();
    caption.innerHTML = '';
  }
}
</script>
</body>
</html>
